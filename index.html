<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content">
<title>realProAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" crossorigin>
<script>

if (!window.crossOriginIsolated && window.isSecureContext && 'serviceWorker' in navigator) {
  navigator.serviceWorker.register('coi-serviceworker.js')
    .then(() => navigator.serviceWorker.ready)
    .then(() => {
      let done = false;
      try { done = sessionStorage.getItem('coiReloaded') === '1'; sessionStorage.setItem('coiReloaded', '1'); } catch {}
      if (!done) location.reload();
    })
    .catch(() => {});
}
</script>
<style>
:root{--bg:#fff;--panel:#fff;--line:#e5e5e5;--bubble:#111;--bubble-fg:#fff;--fg:#111;--mut:#888;--mut-on-bubble:#aaa}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:15px/1.55 "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{margin:0;font-size:17px}h1 small{color:var(--mut);font-weight:400;font-size:12px;margin-left:6px}
#info{color:var(--mut);font-size:12px}
main{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:min(760px,88%);padding:11px 16px;border-radius:20px;background:var(--bubble);color:var(--bubble-fg);white-space:pre-wrap;word-break:break-word;box-shadow:0 2px 10px rgba(0,0,0,.08);animation:pop .28s cubic-bezier(.2,.8,.2,1);transition:background-color .25s,color .25s}
.msg.user{align-self:flex-end;border-bottom-right-radius:6px}
.msg.bot{align-self:flex-start;border-bottom-left-radius:6px}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}.msg.err{background:#4a1f24;color:#fff}
.msg.thinking{font-style:italic;color:var(--mut-on-bubble)}
.msg.md{white-space:normal}
.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md p,.md ul,.md ol,.md pre,.md blockquote,.md table{margin:0 0 .7em}
.md h1,.md h2,.md h3,.md h4{margin:.9em 0 .4em;line-height:1.3}
.md h1{font-size:1.35em}.md h2{font-size:1.2em}.md h3{font-size:1.08em}.md h4{font-size:1em}
.md ul,.md ol{padding-left:1.4em}.md li{margin:.2em 0}
.md code{font:.9em/1.5 Consolas,"D2Coding",monospace;background:#2a2a2a;padding:.1em .35em;border-radius:4px}
.md pre{background:#2a2a2a;padding:10px 12px;border-radius:8px;overflow-x:auto}
.md pre code{padding:0;background:none;white-space:pre}
.md blockquote{border-left:3px solid #555;padding-left:10px;color:var(--mut-on-bubble)}
.md table{border-collapse:collapse;display:block;overflow-x:auto}
.md th,.md td{border:1px solid #444;padding:5px 9px}.md th{background:#2a2a2a}
.md hr{border:0;border-top:1px solid #444;margin:.9em 0}
#status{display:flex;align-items:center;gap:10px}
#bar{width:220px;height:8px;background:var(--line);border-radius:999px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--bubble);border-radius:999px;transition:width .4s ease-out}
footer{padding:10px 16px;background:var(--panel);border-top:1px solid var(--line)}
#form{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;resize:none;max-height:160px;background:var(--bg);color:var(--fg);border:1px solid #d0d0d0;border-radius:20px;padding:10px 16px;font:inherit;outline:none;transition:border-color .2s,box-shadow .2s}
textarea:focus{border-color:#999;box-shadow:0 0 0 4px rgba(0,0,0,.06)}
button{background:var(--bubble);color:var(--bubble-fg);border:0;border-radius:20px;padding:10px 18px;cursor:pointer;font:inherit;transition:opacity .2s,transform .5s cubic-bezier(.34,2,.5,1),background-color .2s,color .2s,border-color .2s;-webkit-tap-highlight-color:transparent}
button:not(:disabled):hover{opacity:.85}
button:not(:disabled):active{transform:scale(.82);transition-duration:.2s,0s}
#stop{background:#e5484d;color:#fff}
button:disabled{opacity:.5;cursor:default}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.actions{display:flex;justify-content:flex-end;margin-top:6px}
.copy{background:transparent;color:var(--mut-on-bubble);border:1px solid #444;border-radius:999px;padding:2px 10px;font-size:12px}
.copy:hover{color:#fff;border-color:#777}
.md .code{position:relative;margin:0 0 .7em}
.md .code pre{margin:0;padding-right:56px}
.md .code .copy{position:absolute;top:6px;right:6px;background:#2a2a2a}
[hidden]{display:none!important}
#right{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
#user{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:12px}
#auth{flex:1;min-height:0;overflow-y:auto;display:flex;align-items:center;justify-content:center;padding:16px}
body.authed #auth,body:not(.authed) main,body:not(.authed) footer,body:not(.authed) #status{display:none}
body.booting #auth{visibility:hidden}
.card{width:100%;max-width:360px}
.view{display:flex;flex-direction:column;gap:10px}
.view h2{margin:0 0 4px;font-size:20px}
.view input{background:var(--bg);color:var(--fg);border:1px solid #d0d0d0;border-radius:20px;padding:10px 16px;font:inherit;outline:none;transition:border-color .2s,box-shadow .2s}
.view input:focus{border-color:#999;box-shadow:0 0 0 4px rgba(0,0,0,.06)}
.note{margin:0;min-height:1.4em;font-size:13px;color:var(--mut)}
.note.err{color:#d93036}
.links{margin:0;display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
button.link{background:none;color:var(--mut);padding:0;border-radius:0;font-size:13px}
button.link:not(:disabled):hover{color:var(--fg);opacity:1}
button.link:not(:disabled):active{transform:none}
</style>
</head>
<body class="booting">
<header>
  <h1>realProAI Chat</h1>
  <div id="right">
    <div id="status">
      <span id="info">로딩 중...</span>
      <div id="bar"><i></i></div>
    </div>
    <div id="user" hidden><span id="user-email"></span><button id="logout" class="link" type="button">로그아웃</button></div>
  </div>
</header>

<section id="auth">
  <div class="card">
    <form id="login" class="view">
      <h2>로그인</h2>
      <input id="li-email" type="email" placeholder="이메일" autocomplete="username">
      <input id="li-pw" type="password" placeholder="비밀번호" autocomplete="current-password">
      <button type="submit">로그인</button>
      <p class="note" id="li-msg"></p>
      <p class="links"><button class="link" type="button" data-go="signup">회원가입</button></p>
    </form>
    <form id="signup" class="view" hidden>
      <h2>회원가입</h2>
      <input id="su-email" type="email" placeholder="이메일" autocomplete="username">
      <input id="su-pw" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="new-password">
      <input id="su-pw2" type="password" placeholder="비밀번호 확인" autocomplete="new-password">
      <button type="submit">가입하기</button>
      <p class="note" id="su-msg"></p>
      <p class="links"><button class="link" type="button" data-go="login">로그인</button></p>
    </form>
  </div>
</section>

<main id="chat"></main>

<footer>
  <form id="form">
    <textarea id="input" rows="1" placeholder="메시지 입력"></textarea>
    <button id="send" type="submit" disabled>전송</button>
    <button id="stop" type="button" hidden>중지</button>
  </form>
</footer>

<script type="module">
import { Wllama } from 'https://cdn.jsdelivr.net/npm/@wllama/wllama@3.8.1/esm/index.js';
import { marked } from 'https://cdn.jsdelivr.net/npm/marked@15.0.12/+esm';
import DOMPurify from 'https://cdn.jsdelivr.net/npm/dompurify@3.2.6/+esm';

marked.setOptions({ gfm: true, breaks: true });
// 답변 속 링크는 새 탭으로 (대화 화면이 날아가지 않게)
DOMPurify.addHook('afterSanitizeAttributes', n => { if (n.tagName === 'A') { n.target = '_blank'; n.rel = 'noopener noreferrer'; } });
const md = text => DOMPurify.sanitize(marked.parse(text));

const MODEL_URL = 'https://huggingface.co/realProAI/PRO-2/resolve/main/model.gguf';
const MODEL_FILE = 'model.gguf';
const N_THREADS = 6; // CPU 추론 스레드 수 (코어가 적으면 그만큼)

const SUPABASE_URL = 'https://wztbcfnclibxbtvnjpuy.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ubtO6cNrYSxUchNYpDew-Q_3qv5Rr0Y'; // 공개용 키 (service_role/secret 키는 절대 넣지 말 것)
const SESSION_KEY = 'realproai-session';
const AUTH_MSG = {
  invalid_credentials: '이메일 또는 비밀번호가 맞지 않아요.',
  weak_password: '비밀번호가 너무 약해요. 6자 이상으로 입력해 주세요.',
  email_address_invalid: '이메일 형식이 올바르지 않아요.',
  validation_failed: '입력값을 확인해 주세요.',
  user_already_exists: '이미 가입된 이메일이에요.',
  email_exists: '이미 가입된 이메일이에요.',
  over_request_rate_limit: '요청이 너무 많아요. 잠시 후 다시 시도해 주세요.'
};

const $ = id => document.getElementById(id);
const chat = $('chat'), input = $('input');
const wllama = new Wllama({
  default: 'https://cdn.jsdelivr.net/npm/@wllama/wllama@3.8.1/esm/wasm/wllama.wasm'
}, { suppressNativeLog: true });
let ctrl = null, session = null, loading = false, modelReady = false, authed = false;
const history = [];
const READY_MSG = 'PRO-2 준비 완료! 메시지를 입력해 대화할 수 있어요.';
const sync = () => { $('send').disabled = !(modelReady && authed); };


async function opfsDir() {
  try { return await (await navigator.storage.getDirectory()).getDirectoryHandle('pro2', { create: true }); }
  catch { return null; }
}
async function fetchFile(url, name, onProg) {
  const dir = await opfsDir();
  if (dir) {

    for (const old of ['mmproj.gguf', 'mmproj.gguf.done']) {
      try { await dir.removeEntry(old); } catch {}
    }
    try { // 완료된 캐시가 있고, HF 파일과 크기가 같으면 사용 (레포에서 파일 교체 시 자동 재다운로드)
      await dir.getFileHandle(name + '.done');
      const f = await (await dir.getFileHandle(name)).getFile();
      let remote = 0;
      try { remote = +(await fetch(url, { method: 'HEAD' })).headers.get('content-length') || 0; } catch {}
      if (!remote || remote === f.size) { onProg(f.size, f.size); return f; }
      await dir.removeEntry(name + '.done');
    } catch {}
  }
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${name}: HTTP ${res.status}`);
  const total = +res.headers.get('content-length') || 0;
  const reader = res.body.getReader();
  let loaded = 0, writable = null, chunks = [];
  if (dir) { try { writable = await (await dir.getFileHandle(name, { create: true })).createWritable(); } catch {} }
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    loaded += value.byteLength;
    writable ? await writable.write(value) : chunks.push(value);
    onProg(loaded, total);
  }
  if (writable) {
    await writable.close();
    await dir.getFileHandle(name + '.done', { create: true });
    return (await dir.getFileHandle(name)).getFile();
  }
  return new Blob(chunks);
}

// ---------- 모델 로드 part (로그인 완료 후 시작) ----------
async function loadModel() {
  try {
    const modelBlob = await fetchFile(MODEL_URL, MODEL_FILE, (l, t) => {
      const p = t ? Math.round(l / t * 100) : 0;
      $('bar').firstElementChild.style.width = p + '%';
      $('info').textContent = `AI 모델 다운로드 중... (최초 1회) ${(l / 1e6).toFixed(0)} / ${(t / 1e6).toFixed(0)} MB (${p}%)`;
    });
    $('info').textContent = '준비 중…';
    await wllama.loadModel([modelBlob], {
      n_ctx: 20000,
      n_threads: Math.min(N_THREADS, navigator.hardwareConcurrency || N_THREADS),
      n_gpu_layers: 0,
      no_kv_offload: true,
      cache_type_k: 'q5_1',
      cache_type_v: 'q4_1',
      flash_attn: true
    });
    $('status').remove();
    modelReady = true; sync();
    if (authed) input.focus();
    addMsg('bot thinking', READY_MSG);
  } catch (e) {
    console.error(e);
    $('bar').remove();
    $('info').textContent = '불러오지 못했어요. 새로고침해 주세요.';
  }
}

// ---------- Supabase ----------
class AuthError extends Error {}
// Supabase REST 호출 (POST). 실패하면 사용자에게 보여줄 문구로 AuthError
async function sb(path, body, token) {
  let res;
  try {
    res = await fetch(SUPABASE_URL + path, {
      method: 'POST',
      headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + (token || SUPABASE_KEY), 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
  } catch { throw new AuthError('서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.'); }
  const raw = await res.text();
  let data = null;
  try { data = raw ? JSON.parse(raw) : null; } catch {}
  if (res.ok) return data;
  const err = data || {};
  const text = err.msg || err.error_description || err.message || '';
  throw new AuthError(AUTH_MSG[err.error_code || err.code || ''] || text || `오류가 발생했어요. (HTTP ${res.status})`);
}
const saved = {
  get() { try { return localStorage.getItem(SESSION_KEY); } catch { return null; } },
  set(v) { try { localStorage.setItem(SESSION_KEY, v); } catch {} },
  del() { try { localStorage.removeItem(SESSION_KEY); } catch {} }
};
const errText = e => e instanceof AuthError ? e.message : (console.error(e), '오류가 발생했어요.');

function setSession(s) {
  session = s; saved.set(s.refresh_token);
  setAuthed(s.user?.email || '');
  if (!loading) { loading = true; loadModel(); } // 모델 다운로드/로드는 로그인 완료 후 시작
}
function setAuthed(email) {
  authed = !!email;
  document.body.classList.remove('booting');
  document.body.classList.toggle('authed', authed);
  $('user').hidden = !authed; $('user-email').textContent = email;
  if (authed) {
    if (modelReady && !chat.childElementCount) addMsg('bot thinking', READY_MSG);
    input.focus();
  } else {
    chat.innerHTML = '';
    show('login');
  }
  sync();
}

// ---------- UI ----------
function addMsg(role, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.textContent = text;
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
  return d;
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return; } catch {}
  const t = document.createElement('textarea'); // http 등 clipboard API를 못 쓰는 환경용
  t.value = text; t.style.cssText = 'position:fixed;opacity:0';
  document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove();
}
function copyBtn(getText) {
  const b = document.createElement('button');
  b.className = 'copy'; b.type = 'button'; b.textContent = '복사';
  b.onclick = async () => {
    await copyText(getText());
    b.textContent = '복사됨'; clearTimeout(b._t); b._t = setTimeout(() => b.textContent = '복사', 1500);
  };
  return b;
}
function addCopy(el, text) {
  const wrap = document.createElement('div');
  wrap.className = 'actions'; wrap.appendChild(copyBtn(() => text)); el.appendChild(wrap);
}
// ``` 코드 블록마다 개별 복사 버튼
function addCodeCopy(el) {
  for (const pre of el.querySelectorAll('pre')) {
    const wrap = document.createElement('div');
    wrap.className = 'code';
    pre.replaceWith(wrap); wrap.append(pre, copyBtn(() => (pre.querySelector('code') ?? pre).textContent));
  }
}
const render = (el, text) => { el.innerHTML = md(text); addCodeCopy(el); };
input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = input.scrollHeight + 'px'; });
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('form').requestSubmit(); }
});
$('stop').onclick = () => ctrl && ctrl.abort();
document.addEventListener('touchstart', () => {}, { passive: true }); // iOS Safari에서 :active(누름 효과)가 동작하도록

// ---------- 로그인 / 회원가입 ----------
const show = v => {
  for (const f of document.querySelectorAll('.view')) f.hidden = f.id !== v;
  $(v).querySelector('input').focus();
};
const note = (id, text, err) => { $(id).textContent = text; $(id).classList.toggle('err', !!err); };
const lock = (form, on) => { $(form).querySelector('button[type=submit]').disabled = on; };
for (const b of document.querySelectorAll('[data-go]')) b.onclick = () => show(b.dataset.go);

$('login').addEventListener('submit', async e => {
  e.preventDefault();
  const email = $('li-email').value.trim(), pw = $('li-pw').value;
  if (!email || !pw) return note('li-msg', '이메일과 비밀번호를 입력해 주세요.', true);
  lock('login', true); note('li-msg', '로그인 중...');
  try {
    setSession(await sb('/auth/v1/token?grant_type=password', { email, password: pw }));
    $('li-pw').value = ''; note('li-msg', '');
  } catch (err) { note('li-msg', errText(err), true); }
  finally { lock('login', false); }
});
$('signup').addEventListener('submit', async e => {
  e.preventDefault();
  const email = $('su-email').value.trim(), pw = $('su-pw').value;
  if (!email) return note('su-msg', '이메일을 입력해 주세요.', true);
  if (pw.length < 6) return note('su-msg', '비밀번호는 6자 이상이어야 해요.', true);
  if (pw !== $('su-pw2').value) return note('su-msg', '비밀번호가 서로 달라요.', true);
  lock('signup', true); note('su-msg', '가입 중...');
  try {
    const r = await sb('/auth/v1/signup', { email, password: pw }) || {};
    if (!r.access_token && (r.user || r).identities?.length === 0) throw new AuthError(AUTH_MSG.user_already_exists);
    $('su-pw').value = $('su-pw2').value = ''; note('su-msg', '');
    if (r.access_token) setSession(r); // 가입하면 바로 로그인
    else { $('li-email').value = email; show('login'); note('li-msg', '가입이 완료됐어요. 로그인해 주세요.'); }
  } catch (err) { note('su-msg', errText(err), true); }
  finally { lock('signup', false); }
});
function clearSession() {
  session = null; history.length = 0; saved.del();
  setAuthed('');
}
$('logout').onclick = () => {
  if (ctrl || !session) return;
  sb('/auth/v1/logout', {}, session.access_token).catch(() => {});
  clearSession();
};

// 저장된 로그인 이어가기
(async () => {
  const token = saved.get();
  if (token) {
    try { return setSession(await sb('/auth/v1/token?grant_type=refresh_token', { refresh_token: token })); } catch {}
  }
  setAuthed('');
})();

// ---------- 대화 ----------
$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || $('send').disabled || ctrl || !session) return;

  history.push({ role: 'user', content: text });
  addMsg('user', text);
  input.value = ''; input.style.height = 'auto';

  const out = addMsg('bot thinking', '(생각하는 중...)');
  // <|...|> 숨김 필터: '<'가 나오면 다음 글자까지 보류 → '|'면 '|>'가 나올 때까지 보류 후 통째로 숨김,
  // '|'가 아니면 보류했던 '<'를 그대로 보여줌
  let acc = '', held = '', state = 0; // 0: 일반, 1: '<' 보류, 2: '<|' 안, 3: '<|...|' (다음 '>' 대기)
  const feed = s => {
    for (const ch of s) {
      if (state === 0) { if (ch === '<') { held = ch; state = 1; } else acc += ch; }
      else if (state === 1) {
        if (ch === '|') { held += ch; state = 2; }
        else { acc += held; held = ''; state = 0; feed(ch); }
      }
      else if (state === 2) { held += ch; if (ch === '|') state = 3; }
      else { held += ch; state = ch === '>' ? 0 : ch === '|' ? 3 : 2; if (state === 0) held = ''; }
    }
  };
  const flush = () => { acc += held; held = ''; state = 0; }; // 끝까지 안 닫히면 그대로 보여줌
  const clean = () => acc.replace(/<think>[\s\S]*?(<\/think>|$)/g, '').trim();
  ctrl = new AbortController();
  $('send').hidden = true; $('stop').hidden = false; $('logout').disabled = true;
  try {
    const stream = await wllama.createChatCompletion({
      messages: history, stream: true, max_tokens: 10240,
      temperature: 0.6, top_p: 0.8, top_k: 20,
      chat_template_kwargs: { enable_thinking: false },
      abortSignal: ctrl.signal
    });
    for await (const chunk of stream) {
      feed(chunk.choices[0]?.delta?.content ?? '');
      const c = clean();
      // 그리기 전에 맨 아래 근처인지 확인 → 위로 스크롤해 읽는 중이면 자동 스크롤 안 함
      const stick = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 40;
      if (c) render(out, c); else out.textContent = '(생각하는 중...)';
      out.classList.toggle('thinking', !c);
      out.classList.toggle('md', !!c);
      if (stick) chat.scrollTop = chat.scrollHeight;
    }
    if (held) { flush(); render(out, clean()); out.classList.remove('thinking'); out.classList.add('md'); }
    history.push({ role: 'assistant', content: clean() });
  } catch (err) {
    if (err.name === 'AbortError' || err.name === 'WllamaAbortError') {
      flush();
      history.push({ role: 'assistant', content: clean() });
    } else {
      out.classList.add('err'); out.classList.remove('md');
      console.error(err);
      out.textContent = '대화 길이가 길어서 답변을 만들지 못했어요. 새로고침 해 주세요.';
      history.pop();
    }
  } finally {
    if (out.classList.contains('err') || clean()) out.classList.remove('thinking');
    if (!out.classList.contains('err') && clean()) addCopy(out, clean());
    $('send').hidden = false; $('stop').hidden = true; $('logout').disabled = false; ctrl = null;
  }
});
</script>
</body>
</html>
